<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskZen - Offline</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/themes.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .offline-message {
            margin-bottom: 2rem;
        }

        .offline-actions {
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body class="theme-light">
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p class="offline-message">
            Don't worry! TaskZen works offline. You can continue working with your tasks,
            and we'll sync everything when you're back online.
        </p>
        <div class="offline-actions">
            <button class="btn primary" onclick="window.location.reload()">Try Again</button>
            <button class="btn secondary" onclick="window.history.back()">Go Back</button>
        </div>
    </div>
</body>
</html>
